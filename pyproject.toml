[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "jsonflux"
version = "1.0.1"
description = "High-performance JSON structure analysis and SQL querying"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Ilhan Karić"}]
keywords = ["json", "analysis", "sql", "duckdb", "arrow", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "duckdb>=1.4.3",
    "msgspec>=0.20.0",
    "pyarrow>=21.0.0",
    "tabulate>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/ikaric/jsonflux"
Repository = "https://github.com/ikaric/jsonflux"
Issues = "https://github.com/ikaric/jsonflux/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jsonflux"]

[tool.hatch.build.targets.sdist]
include = [
    "src/jsonflux/**",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src"]
exclude = ["generator.py", "json-summarizer.py", "main.py"]  # Temporary/reference files

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # Line length handled by formatter; URLs/strings can exceed

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
